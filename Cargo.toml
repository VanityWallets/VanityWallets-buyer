[package]
name = "pokupatel"
version = "0.1.0"
edition = "2021"
description = "Buyer's tool for split-key vanity wallets (TRON / ETH / BTC), fully offline"

[dependencies]
secp256k1 = { version = "0.29", features = ["std"] }
tiny-keccak = { version = "2.0", features = ["keccak"] }
sha2 = "0.10"
ripemd = "0.1"
bech32 = "0.11"
bs58 = { version = "0.5", features = ["check", "std"] }
rand = "0.8"

# Стирание секретов из памяти.
zeroize = "1"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Без accesskit: текст окна (ключ) не публикуется через UI Automation.
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
arboard = { version = "3.6", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0

# Заглушка вместо webbrowser (из egui): программа никогда не открывает браузер
# и не запускает другие программы.
[patch.crates-io]
webbrowser = { path = "stubs/webbrowser" }
